<!--
  【役割】全画面のボトムに表示されるナビゲーションメニュー（共通部品）です。
  各画面から th:replace="fragments/menu :: header" のように呼び出されて使われます。

  TODO: BootstrapのNavbarコンポーネントを使ってメニュー枠を作る
  TODO: 「ホーム」「在庫一覧」「買い物リスト」など各画面へのリンク（th:href）を設定する
-->
<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <!--
    【共通メニュー】
    th:fragment="menu" を付けることで、
    各画面から呼び出せる部品になる。

    navbar       ：Bootstrapのナビゲーション用クラス
    bg-white     ：背景を白色にする
    border-top   ：上側に境界線を付ける
    fixed-bottom ：画面の下部に固定する
  -->
  <nav th:fragment="menu"
      class="navbar navbar-light bg-white border-top fixed-bottom">

    <!--
      container-fluid ：横幅いっぱいに広げる
      p-0             ：内側の余白を0にする
    -->
    <div class="container-fluid p-0">

      <!--
        row ：横並びの行を作る
        w-100 ：横幅を100%にする
        g-0 ：項目同士の余白をなくす
      -->
      <div class="row w-100 g-0 text-center">

        <!-- ホーム画面へのリンク -->
        <div class="col">
          <a th:href="@{/home}"
            class="nav-link d-flex flex-column align-items-center py-2">

            <!-- ホームのアイコン -->
            <span>🏠</span>

            <!-- メニュー名 -->
            <small>ホーム</small>
          </a>
        </div>

        <!-- 在庫一覧画面へのリンク -->
        <div class="col">
          <a th:href="@{/inventory}"
            class="nav-link d-flex flex-column align-items-center py-2">

            <!-- 在庫のアイコン -->
            <span>📦</span>

            <!-- メニュー名 -->
            <small>在庫一覧</small>
          </a>
        </div>

        <!-- 購入履歴画面へのリンク -->
        <div class="col">
          <a th:href="@{/purchase-history}"
            class="nav-link d-flex flex-column align-items-center py-2">

            <!-- 購入履歴のアイコン -->
            <span>🧾</span>

            <!-- メニュー名 -->
            <small>購入履歴</small>
          </a>
        </div>

        <!-- 買い物リスト画面へのリンク -->
        <div class="col">
          <a th:href="@{/shopping-list}"
            class="nav-link d-flex flex-column align-items-center py-2">

            <!-- 買い物のアイコン -->
            <span>🛒</span>

            <!-- メニュー名 -->
            <small>買い物リスト</small>
          </a>
        </div>

      </div>
    </div>
  </nav>

  <div class="container mt-4 mb-5">


    <!-- TODO: ここに各画面のテーブルやフォームを作っていく -->

  </div>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>
</html>
