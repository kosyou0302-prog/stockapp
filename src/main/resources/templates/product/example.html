<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>商品登録</title>
</head>

<body>

<h2>商品登録</h2>

<form th:action="@{/item/save}"
      th:object="${item}"
      method="post">

    <label>商品名</label>
    <input type="text"
           th:field="*{itemName}">

    <br><br>

    <label>分類</label>
    <select th:field="*{category}">
        <option value="食品">食品</option>
        <option value="日用品">日用品</option>
        <option value="防災用品">防災用品</option>
    </select>

    <br><br>

    <label>在庫数</label>
    <input type="number"
           th:field="*{stockQty}">

    <select th:field="*{stockUnit}">
        <option value="個">個</option>
        <option value="本">本</option>
        <option value="袋">袋</option>
    </select>

    <br><br>

    <label>購入目安</label>
    <input type="number"
           th:field="*{purchaseLimit}">

    <br><br>

    <label>使用期限</label>
    <input type="date"
           th:field="*{expiryDate}">

    <br><br>

    <label>通知</label>
    <input type="checkbox"
           th:field="*{noticeFlg}">

    <br><br>

    <button type="submit">
        登録する
    </button>

</form>

</body>
</html>
