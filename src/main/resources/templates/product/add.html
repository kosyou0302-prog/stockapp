  TODO: ProductForm（DTO）と入力欄を紐づけるため、th:object と th:field を設定する

<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>４商品登録画面</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <!--
    ※ ヘッダー（色は未だ仮設定）
    bg-primary：背景を青色にする
    text-white：文字を白色にする
  -->

  <!-- ヘッダー（戻るボタンのデザインを綺麗に統一） -->
  <div class="card-header bg-primary text-white position-relative">
    <a th:href="@{/inventory/list}"
      class="btn btn-outline-light fw-bold position-absolute start-0 top-50 translate-middle-y ms-2">
    ← 戻る
    </a>
    <header class="bg-primary text-white text-center py-3">
      <h1 class="h4 fw-bold mb-0">商品登録</h1>
    </header>
  </div>

  <!-- メインコンテンツ -->
  <main class="container mt-4 mb-5 pb-5">
    <section class="mb-3">
      <form th:action="@{/product/add}" th:object="${item}" method="post" enctype="multipart/form-data">

        <!-- エラー一覧 -->
        <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
          <ul class="mb-0">
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
          </ul>
        </div>

        <!-- 商品名 -->
        <div class="mb-3">
          <label class="form-label fw-bold">商品名</label>
          <div class="d-flex align-items-center gap-2">

            <!-- 商品名入力 -->
            <input type="text" class="form-control me-2" th:field="*{name}" placeholder="例）牛乳">

            <!-- 選択中アイコン（DBマスタのIDで画像を表示するように修正） -->
            <img id="preview" th:src="${item.icon != null ? '/images/icons/' + item.icon.id + '.png' : '/images/icons/1.png'}"
              style="width:50px;height:50px;" class="border rounded">
          </div>
          <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <!-- アイコン選択 -->
        <div class="mb-3">
          <label class="form-label fw-bold">アイコン選択</label>

          <!-- iconPath ではなく IconマスタのID（icon.id）を送信するように修正 -->
          <input type="hidden" id="iconId" th:field="*{icon.id}">

          <!-- アイコン一覧 -->
          <img id="preview" th:src="${item.icon != null ? '/images/icons/' + item.icon.id + '.png' : '/images/icons/1.png'}"
          style="width:50px;height:50px;" class="border rounded">
        </div>

        <!-- 分類（カテゴリ） -->
        <div class="mb-3">
          <label class="form-label fw-bold">分類</label>
          <!-- 文字列ではなく CategoryマスタのID（category.id）を送信するように修正 -->
          <select class="form-select" th:field="*{category.id}">
              <option value="">選択してください</option>
              <option value="1">食品</option>
              <option value="2">日用品</option>
              <option value="3">その他</option>
          </select>
          <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
        </div>

        <!-- 在庫数 -->
        <div class="mb-3">
          <label class="form-label fw-bold">在庫数</label>
          <div class="row">
            <!-- 左側：在庫数の入力 -->
            <div class="col-6">
              <input type="number" class="form-control" th:field="*{stock}">
            </div>

            <!-- 右側：単位の選択 -->
            <div class="col-6">
              <select class="form-select" th:field="*{unit.id}">
                  <option value="1">個</option>
                  <option value="2">本</option>
                  <option value="3">パック</option>
                  <option value="4">箱</option>
                </select>
            </div>
          </div>
          <!-- エラー表示 -->
          <div class="text-danger small" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
        </div>

        <!-- 購入目安 -->
        <div class="mb-3">
          <label class="form-label fw-bold">購入目安</label>
          <div class="row">
            <div class="col-6">
                <input type="number" class="form-control" th:field="*{threshold}">
            </div>
            <div class="col-6">
              <select class="form-select" th:field="*{thresholdUnit.id}">
                <option value="1">個</option>
                <option value="2">本</option>
                <option value="3">パック</option>
                <option value="4">箱</option>
              </select>
            </div>
          </div>
          <div class="text-danger small" th:if="${#fields.hasErrors('threshold')}" th:errors="*{threshold}"></div>
        </div>

        <!-- 使用期限 -->
        <div class="mb-3">
          <label class="form-label fw-bold">使用期限</label>
          <input type="date" class="form-control" th:field="*{expiryDate}">
          <div class="text-danger small" th:if="${#fields.hasErrors('expiryDate')}" th:errors="*{expiryDate}"></div>
        </div>

        <!-- 通知設定 　日数設定を追加-->
        <div class="d-flex align-items-center gap-3">
          <label class="form-label fw-bold mb-0">通知</label>

          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" th:field="*{isNotify}">
          </div>

          <label class="mb-0 align-items fw-bold"></label>
          <select class="form-select w-auto" th:field="*{alertDays}">
            <option value="3">3日前</option>
            <option value="7">7日前</option>
          </select>
        </div><br>

        <!-- 登録ボタン -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">登録する</button>
        </div>
      </form>

      <div class="row row-cols-4 g-2"></div>
    </section>
  </main>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
