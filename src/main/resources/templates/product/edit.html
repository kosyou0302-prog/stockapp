<!--
  【役割】５商品の登録情報を変更（編集登録）するためのフォーム画面です。

  TODO: formタグの送信先（th:action）とメソッド（POST）を正しく設定する
  TODO: ProductForm（DTO）と入力欄を紐づけるため、th:object と th:field を設定する
  TODO: バリデーションエラーが起きた場合にエラーメッセージ（th:errors）を表示する箇所を作る
-->
<!DOCTYPE html>
 <!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>５商品編集画面</title>
<!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <!-- メインコンテンツ -->
  <div class="container py-4">
    <div class="card shadow mx-auto" style="max-width: 400px;">

        <!-- ヘッダー -->
      <div class="card-header bg-primary text-white position-relative">
        <a th:href="@{/inventory/list}"
        class="btn btn-primary fw-bold position-absolute start-0 ms-2">
        ← 戻る
        </a>
        <h4 class="mb-0 text-center">商品編集</h4>
      </div>      


      <div class="card-body">
       <form th:action="@{/product/edit}" th:object="${item}"
            method="post" enctype="multipart/form-data">

              <!-- ID保持 -->
              <input type="hidden" th:field="*{id}">

              <!-- エラー一覧 -->
              <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                  <ul class="mb-0">
                      <li th:each="err : ${#fields.errors('*')}" th:text="${err}">
                      </li>
                  </ul>
              </div>

<!-- 商品名 -->
<div class="mb-3">
    <label class="form-label fw-bold">商品名</label>

    <div class="row align-items-center">

        <!-- 商品名入力 -->
        <div class="col-9">
            <input type="text"
                   class="form-control"
                   th:field="*{name}">
        </div>

        <!-- アイコン表示 -->
        <div class="col-3 text-center">
            <img id="preview"
                 th:src="${item.iconPath != null ? item.iconPath : '/images/icons/1.png'}"
                 class="border rounded"
                 style="width:50px;height:50px;">
        </div>

    </div>

    <!-- エラー表示 -->
    <div class="text-danger small"
         th:if="${#fields.hasErrors('name')}"
         th:errors="*{name}">
    </div>
    </div>
              <!-- アイコン一覧 -->
              <div class="row row-cols-4 g-2">
              <div class="col" th:each="i : ${#numbers.sequence(1,20)}">

              <img th:src="@{'/images/icons/' + ${i} + '.png'}"
              th:data-path="@{'/images/icons/' + ${i} + '.png'}"
              class="img-thumbnail icon-select"
              style="cursor:pointer; width:48px; height:48px; object-fit:cover;">
              </div>
              </div>

              <!-- 分類 -->
              <div class="mb-3">
                  <label class="form-label fw-bold">分類</label>
                  <select class="form-select" th:field="*{category}">
                    <option value="">選択してください</option>
                      <option value="食品">食品</option>
                      <option value="日用品">日用品</option>
                      <option value="その他">その他</option>
                  </select>

                  <div class="text-danger small" th:if="${#fields.hasErrors('category')}"
                    th:errors="*{category}">
                  </div>

              </div>

              <!-- 在庫数 -->
              <div class="mb-3">
                  <label class="form-label fw-bold">在庫数</label>
                  <div class="row">
                      <div class="col-6">
                          <input type="number" class="form-control" th:field="*{stock}">
                      </div>
                      <div class="col-6">
                          <select class="form-select" th:field="*{unit}">
                              <option value="個">個</option>
                              <option value="本">本</option>
                              <option value="パック">パック</option>
                              <option value="箱">箱</option>
                          </select>
                      </div>
                  </div>
                <div class="text-danger small"
                        th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">
                </div>
              </div>

              <!-- 購入目安 -->
              <div class="mb-3">
                  <label class="form-label fw-bold">購入目安</label>
                  <div class="row">
                      <div class="col-6">
                          <input type="number" class="form-control" th:field="*{threshold}">
                      </div>
                      <div class="col-6">
                          <select class="form-select" th:field="*{thresholdUnit}">
                              <option value="個">個</option>
                              <option value="本">本</option>
                              <option value="パック">パック</option>
                              <option value="箱">箱</option>
                          </select>
                      </div>
                  </div>

                  <div class="text-danger small" th:if="${#fields.hasErrors('threshold')}"
                        th:errors="*{threshold}">
                  </div>
              </div>

              <!-- 使用期限 -->
              <div class="mb-3">
                  <label class="form-label fw-bold">使用期限</label>
                  <input type="date" class="form-control" th:field="*{expiryDate}">
                  <div class="text-danger small" th:if="${#fields.hasErrors('expiryDate')}"
                        th:errors="*{expiryDate}">
                  </div>

              </div>

              <!-- 通知 -->

              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="form-label fw-bold mb-0">通知</label>
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{isNotify}">
                  </div>
                </div>
              </div>

              <!-- 削除・保存ボタン -->
              <div class="row g-2">
                <div class="col-6">
                  <a th:href="@{/product/delete/{id}(id=*{id})}"
                  class="btn btn-warning text-danger w-100 fw-bold">この商品を削除する</a>
                </div>

                <div class="col-6">
                <button type="submit" class="btn btn-primary w-100 fw-bold">保存する</button>
                </div>
              </div>
            </div>
        </form>
        </div>
  </div>
 </div>

  <!-- アイコンプレビュー -->
  <script>
  document.getElementById('iconFile')
  .addEventListener('change', function(event){
      const file = event.target.files[0];
      if(file){
          const reader = new FileReader();
          reader.onload = function(e){
              document.getElementById('preview').src =
                  e.target.result;
          };
          reader.readAsDataURL(file);
      }
  });
  </script>

</body>
</html>
