
<!--
  【役割】「在庫が少ない」「消費期限が切れている」など、要注意の商品だけを絞り込んで表示する画面です。

  TODO: InventoryControllerから渡されたアラート対象リストを th:each でループ表示する
  TODO: なぜアラートが出ているか（在庫不足か期限切れか）が視覚的にわかるデザインにする
-->
<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <!--
    ① ヘッダー
    この画面専用のタイトルを中央に表示する

    bg-primary：背景を青色にする
    text-white：文字を白色にする
    text-center：中央揃えにする
    py-3：上下に余白を設定する
  -->
  <header class="bg-primary text-white text-center py-3">
    <h1 class="h4 fw-bold mb-0">期限・在庫切れリスト</h1>
  </header>


  <!-- メインコンテンツ（ここに各画面のTODOを書いていきます） -->
  <div class="container mt-4 mb-5">

    <!--
      ② 画面切り替えタブ
      在庫一覧と期限・在庫切れ画面を切り替える

      nav：ナビゲーション
      nav-pills：タブ形式のデザイン
      nav-fill：タブを均等な幅で配置する
    -->
    <section class="mb-3">

      <ul class="nav nav-pills nav-fill">

        <!-- 在庫一覧タブ -->
        <li class="nav-item">
          <a class="nav-link"
            th:href="@{/inventory}">
            在庫一覧
          </a>
        </li>

        <!-- 期限・在庫切れタブ -->
        <li class="nav-item">
          <a class="nav-link active"
            th:href="@{/alerts}">
            期限・在庫切れ
          </a>
        </li>

      </ul>

    </section>


    <!--
      ③ アラートの種類による絞り込み

      すべて：
        在庫切れ・残りわずか・期限切れ・期限まぢかの
        いずれかに該当する商品を表示する

      在庫切れ・残りわずか：
        在庫切れ・残りわずかの商品だけを表示する

      期限切れ・期限まぢか：
        期限切れ・期限まぢかの商品だけを表示する

      商品の絞り込みはController側で行う
    -->
    <section class="mb-3">

      <div class="d-flex gap-2">

        <!-- すべてのアラート対象商品を表示 -->
        <a th:href="@{/alerts}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedAlertType == null or selectedAlertType == ''} ? ' active' : ''">
          すべて
        </a>

        <!-- 在庫切れ・残りわずかの商品を表示 -->
        <a th:href="@{/alerts(type='stock')}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedAlertType == 'stock'} ? ' active' : ''">
          在庫切れ・残りわずか
        </a>

        <!-- 期限切れ・期限まぢかの商品を表示 -->
        <a th:href="@{/alerts(type='expiry')}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedAlertType == 'expiry'} ? ' active' : ''">
          期限切れ・期限まぢか
        </a>

      </div>

    </section>


    <!--
      ④ アラート対象商品一覧
      InventoryControllerから受け取った商品リストを表示する

      list-group：商品を一覧形式で並べる
      list-group-item：一覧の各商品
      d-flex：横並びにする
      justify-content-between：左右に分けて配置する
      align-items-center：上下中央揃えにする
    -->
    <section class="mb-4">

      <div class="list-group">

        <!-- 商品リストを1件ずつ繰り返し表示 -->
        <a th:each="product : ${products}"
          th:href="@{/products/{id}/edit(id=${product.id})}"
          class="list-group-item list-group-item-action d-flex align-items-center justify-content-between gap-2 py-3">

          <!-- 商品アイコン・商品名・カテゴリー -->
          <div class="d-flex align-items-center gap-3">

            <!-- 商品アイコン -->
            <span class="fs-2"
                  th:text="${product.icon.name}">
              🥛
            </span>

            <!-- 商品名・カテゴリー -->
            <div>

              <!-- 商品名 -->
              <div class="fw-bold"
                  th:text="${product.name}">
                牛乳
              </div>

              <!-- カテゴリー -->
              <div class="text-secondary small"
                  th:text="${product.category.name}">
                食品
              </div>

            </div>

          </div>


          <!--
            右側：アラート内容
            ※Controller側で products を条件に合わせて取得する必要がある。
            「すべて」の場合：警告表示なし

            在庫切れ：赤色
            期限切れ：オレンジ色
            残りわずか：紫色
            期限まぢか：青色

            rounded：角を丸くする
            px-3 py-2：内側に余白を設定する
            text-center：中央揃えにする
            text-nowrap：文字が途中で改行されないようにする
          -->


          <!--
            在庫切れ・残りわずかタブの場合
          -->
          <div th:if="${selectedAlertType == 'stock'}"
              class="rounded px-3 py-2 text-center fw-bold small text-nowrap"
              th:classappend="${product.stock == 0} ? ' bg-danger-subtle text-danger' : ''">

            <!-- 在庫切れの場合：赤色 -->
            <span th:if="${product.stock == 0}">
              在庫切れ
            </span>

            <!-- 残りわずかの場合：紫色 -->
            <span th:if="${product.stock != null and product.threshold != null and product.stock > 0 and product.stock <= product.threshold}"
                  class="bg-light text-purple">
              残りわずか（残り<span th:text="${product.stock}">1</span><span th:text="${product.unit.name}">袋</span>）
            </span>

          </div>


          <!--
            期限切れ・期限まぢかタブの場合
          -->
          <div th:if="${selectedAlertType == 'expiry'}"
              class="rounded px-3 py-2 text-center fw-bold small text-nowrap">

            <!-- 期限切れの場合：オレンジ色 -->
            <span th:if="${product.expiryDate != null and product.expiryDate.isBefore(T(java.time.LocalDate).now())}"
                  class="bg-warning-subtle text-warning">
              期限切れ（<span th:text="${#temporals.format(product.expiryDate, 'M/d')}">10/20</span>）
            </span>

            <!-- 期限まぢかの場合：青色 -->
            <span th:if="${product.expiryDate != null and product.alertDays != null and !product.expiryDate.isBefore(T(java.time.LocalDate).now()) and product.expiryDate.isBefore(T(java.time.LocalDate).now().plusDays(product.alertDays))}"
                  class="bg-primary-subtle text-primary">
              期限まぢか（残り<span th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(T(java.time.LocalDate).now(), product.expiryDate)}">3</span>日）
            </span>

          </div>
          <!--
            selectedAlertType が null または空文字の場合は、
            上記2つのアラート表示部分はどちらも表示されない。

            そのため「すべて」では商品情報だけが表示される。
          -->
        </a>

      </div>


      <!-- 商品が1件も登録されていない場合 -->
      <p th:if="${#lists.isEmpty(products)}"
        class="text-center text-secondary py-4">
        アラート対象の商品はありません。
      </p>

    </section>

  </div>


  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: menu}"></div>


  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->

</body>
</html>
