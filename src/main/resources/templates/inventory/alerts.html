<!--
  【役割】「在庫が少ない」「消費期限が切れている」など、
  要注意の商品だけを絞り込んで表示する画面です。

  TODO: InventoryControllerから渡されたアラート対象リストを th:each でループ表示する
  TODO: なぜアラートが出ているか（在庫不足か期限切れか）が視覚的にわかるデザインにする

  【表示方針】
  ・「すべて」を含め、商品の状態に応じたアラートを1つ表示する
  ・表示の優先順位はProductのgetPrimaryAlert(today)に従う
  ・選択中のアラート種別と検索キーワードをControllerへ送信する
-->
<!DOCTYPE html>

<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">

  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>

  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <!-- ① ヘッダー：この画面専用のタイトルを中央に表示する -->
  <header class="bg-primary text-white text-center py-3">
    <h1 class="h4 fw-bold mb-0">期限・在庫切れリスト</h1>
  </header>

  <!-- メインコンテンツ。today：この画面で使用する今日の日付。 -->
  <main class="container mt-4 mb-5 pb-5" th:with="today=${T(java.time.LocalDate).now()}">

    <!--
      ② 商品検索欄
      商品名を入力して検索する。選択中のアラート種別と検索キーワードをControllerへ送信する。
      input-group：入力欄とボタンをまとめる ／ form-control：入力フォームのデザイン
    -->
    <section class="mb-3">
      <form th:action="@{/inventory/alerts}" method="get">
        <div class="input-group">
          <!-- 商品名の検索キーワード -->
          <input type="text" name="keyword" class="form-control" placeholder="商品名で検索" th:value="${keyword}">

          <!-- 検索ボタン -->
          <button type="submit" class="btn btn-outline-primary">検索</button>
        </div>

        <!-- 選択中のアラート種別を検索条件として引き継ぐ -->
        <input type="hidden" name="type" th:value="${selectedAlertType}"
              th:if="${selectedAlertType != null and selectedAlertType != ''}">
      </form>
    </section>

    <!-- ③ 画面切り替えタブ：在庫一覧と期限・在庫切れ画面を切り替える -->
    <section class="mb-3">
      <ul class="nav nav-pills nav-fill">
        <!-- 在庫一覧タブ -->
        <li class="nav-item">
          <a class="nav-link main-tab" th:href="@{/inventory/list}" data-tab="list">在庫一覧</a>
        </li>

        <!-- 期限・在庫切れタブ：通常の移動では「すべて」を表示 -->
        <li class="nav-item">
          <a class="nav-link active main-tab" th:href="@{/inventory/alerts}" aria-current="page" data-tab="alerts">期限・在庫切れ</a>
        </li>
      </ul>
    </section>

    <!--
      ④ アラートの種類による絞り込み
      すべて：在庫切れ・残りわずか・期限切れ・期限まぢかのいずれかに該当する商品
      在庫切れ・残りわずか：在庫切れ・残りわずかの商品
      期限切れ・期限まぢか：期限切れ・期限まぢかの商品

      選択中のボタンにはactiveを付け、青背景・白文字にする。
      typeの指定がない場合は「すべて」を選択状態にする。

      商品の絞り込みはController・Service側で行う。
      Controllerから、選択したtypeをselectedAlertTypeとして受け取る。
      アラートの種類を切り替える際も、検索キーワードを引き継ぐ。
    -->
    <div id="inventory-content-container">
      <div th:fragment="alertsContent">
    <section class="mb-3">
      <div class="d-flex gap-2">
        <!-- すべて：通常の画面移動時の標準 -->
        <a th:href="@{/inventory/alerts(keyword=${keyword})}" class="btn btn-outline-primary btn-sm flex-fill alert-tab"
          th:classappend="${selectedAlertType == null or selectedAlertType == ''} ? ' active' : ''" data-type="">すべて</a>

        <!-- 在庫切れ・残りわずか：ホームからout・lowで移動した場合も選択状態 -->
        <a th:href="@{/inventory/alerts(type='stock', keyword=${keyword})}"
          class="btn btn-outline-primary btn-sm flex-fill alert-tab" data-type="stock"
          th:classappend="${selectedAlertType == 'stock' or selectedAlertType == 'out' or selectedAlertType == 'low'} ? ' active' : ''">
          在庫切れ・残りわずか
        </a>

        <!-- 期限切れ・期限まぢか：ホームからexpired・soonで移動した場合も選択状態 -->
        <a th:href="@{/inventory/alerts(type='expiry', keyword=${keyword})}"
          class="btn btn-outline-primary btn-sm flex-fill alert-tab" data-type="expiry"
          th:classappend="${selectedAlertType == 'expiry' or selectedAlertType == 'expired' or selectedAlertType == 'soon'} ? ' active' : ''">
          期限切れ・期限間近
        </a>
      </div>
    </section>

    <!--
      ⑤ アラート対象商品一覧
      InventoryControllerから受け取った商品リストを表示する。
      list-group：商品を一覧形式で並べる ／ list-group-item：一覧の各商品
      d-flex：横並び ／ justify-content-between：左右に分ける ／ align-items-center：上下中央揃え
    -->
    <section class="mb-4" id="product-list-container">
      <div th:fragment="alertList" th:with="today=${T(java.time.LocalDate).now()}">
        <div class="list-group">
          <!--
            商品リストを1件ずつ繰り返し表示する。
            外側のdivで商品1件分を囲み、内側のaで行全体をリンクにする。
            aの中ではdivを使わず、spanで内容をまとめる。
            data-alert-type：getPrimaryAlert(today)の判定結果を属性として保持する。
          -->
          <div th:each="product : ${products}" class="list-group-item p-0"
              th:data-alert-type="${product.getPrimaryAlert(today)}">
            <a th:href="@{/product/edit/{id}(id=${product.id})}"
              class="list-group-item-action d-flex flex-wrap align-items-center justify-content-between gap-2 w-100 px-3 py-3 text-decoration-none text-body">

              <!-- 左側：商品アイコン・商品名・カテゴリー -->
              <span class="d-flex align-items-center gap-3">
                <!-- 商品アイコン -->
                <img th:src="@{'/images/icons/' + ${product.icon.id} + '.png'}"
                    style="width:40px; height:40px; object-fit:cover;" class="rounded" alt="アイコン">

                <!-- 商品名・カテゴリー。d-blockで1行ずつ表示する。 -->
                <span>
                  <span class="d-block fw-bold" th:text="${product.name}">牛乳</span>
                  <span class="d-block text-secondary small" th:text="${product.category.name}">食品</span>
                </span>
              </span>

              <!--
                右側：アラート内容
                ※Controller側でproductsを条件に合わせて取得する必要がある。
                「すべて」を含め、getPrimaryAlert(today)の判定結果に従って警告を1つ表示する。

                優先度１：期限切れ・オレンジ色 ／ 優先度２：在庫切れ・赤色
                優先度３：期限まぢか・青色 ／ 優先度４：残りわずか・紫色
              -->
              <span class="d-flex flex-wrap align-items-center justify-content-end gap-2 ms-auto">
                <!--
                  複数条件に該当する場合も、優先順位が最も高い警告だけを表示する。
                  ホームからout・low・expired・soonで移動した場合も、この判定結果に従う。
                  NONEの場合は、該当する警告がないため表示しない。
                -->
                <th:block th:switch="${product.getPrimaryAlert(today)}">

                  <!-- 期限切れの場合：今日より前の日付・オレンジ -->
                  <span th:case="'EXPIRED'" class="d-inline-block rounded px-3 py-2 bg-warning-subtle text-warning-emphasis">
                    期限切れ（<span th:text="${#temporals.format(product.expiryDate, 'M/d')}">10/20</span>）
                  </span>

                  <!-- 在庫切れの場合：赤色 -->
                  <span th:case="'OUT_OF_STOCK'" class="d-inline-block rounded px-3 py-2 bg-danger-subtle text-danger">
                    在庫切れ
                  </span>

                  <!-- 期限まぢかの場合：今日からalertDays日後まで・青色 -->
                  <span th:case="'EXPIRING_SOON'" class="d-inline-block rounded px-3 py-2 bg-primary-subtle text-primary">
                    期限まぢか（残り<span th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(today, product.expiryDate)}">3</span>日）
                  </span>

                  <!--
                    残りわずかの場合：紫色。在庫数が1以上で、購入目安以下の場合。
                    判定はgetPrimaryAlert(today)で行う。text-purpleは共通CSSで定義する。
                  -->
                  <span th:case="'LOW_STOCK'" class="d-inline-block rounded px-3 py-2 bg-light text-purple">
                    残りわずか（残り<span th:text="${product.stock}">1</span><span th:text="${product.unit.name}">袋</span>）
                  </span>
                </th:block>
              </span>
            </a>
          </div>
        </div>
        <!-- 商品未登録、または検索・絞り込みの結果アラート対象の商品が0件の場合 -->
        <p th:if="${#lists.isEmpty(products)}" class="text-center text-secondary py-4">
          アラート対象の商品はありません。
        </p>
      </div>
    </section>
    </div>
    </div>
  </main>

  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: menu}"></div>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>

  <!-- 非同期処理（JS）が必要な画面だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>

</html>
