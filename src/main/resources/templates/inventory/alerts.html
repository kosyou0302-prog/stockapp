<!--
  【役割】「在庫が少ない」「消費期限が切れている」など、
  要注意の商品だけを絞り込んで表示する画面です。

  TODO: InventoryControllerから渡されたアラート対象リストを th:each でループ表示する
  TODO: なぜアラートが出ているか（在庫不足か期限切れか）が視覚的にわかるデザインにする

  【今回の追加】
  ・needsReviewがtrueの商品に「⚠ 要確認」を表示する
  ・在庫数・使用期限の確認が必要なことを案内する
  ・確認マークは、右側のアラート警告のすぐ左に配置する
  ・「すべて」の場合は右側のアラート警告を表示しない
-->
<!DOCTYPE html>

<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">

  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>

  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <!--
    ① ヘッダー
    この画面専用のタイトルを中央に表示する
  -->
  <header class="bg-primary text-white text-center py-3">
    <h1 class="h4 fw-bold mb-0">期限・在庫切れリスト</h1>
  </header>


  <!--
    メインコンテンツ（ここに各画面のTODOを書いていきます）
    today：この画面で使用する今日の日付。
  -->
  <main class="container mt-4 mb-5 pb-5"
        th:with="today=${T(java.time.LocalDate).now()}">

    <!--
      ② 画面切り替えタブ
      在庫一覧と期限・在庫切れ画面を切り替える
    -->
    <section class="mb-3">
      <ul class="nav nav-pills nav-fill">

        <!-- 在庫一覧タブ -->
        <li class="nav-item">
          <a class="nav-link"
            th:href="@{/inventory/list}">
            在庫一覧
          </a>
        </li>

        <!-- 期限・在庫切れタブ：通常の移動では「すべて」を表示 -->
        <li class="nav-item">
          <a class="nav-link active"
            th:href="@{/inventory/alerts}"
            aria-current="page">
            期限・在庫切れ
          </a>
        </li>

      </ul>
    </section>


    <!--
      ③ アラートの種類による絞り込み

      すべて：
        在庫切れ・残りわずか・期限切れ・期限まぢかの
        いずれかに該当する商品を表示する

      在庫切れ・残りわずか：
        在庫切れ・残りわずかの商品だけを表示する

      期限切れ・期限まぢか：
        期限切れ・期限まぢかの商品だけを表示する

      選択中のボタンにはactiveを付け、青背景・白文字にする。
      typeの指定がない場合は「すべて」を選択状態にする。

      商品の絞り込みはController・Service側で行う。
      Controllerから、選択したtypeをselectedAlertTypeとして受け取る。
    -->
    <section class="mb-3">
      <div class="d-flex gap-2">

        <!-- すべて：通常の画面移動時の標準 -->
        <a th:href="@{/inventory/alerts}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedAlertType == null or selectedAlertType == ''} ? ' active' : ''">
          すべて
        </a>

        <!-- 在庫切れ・残りわずか：ホームからout・lowで移動した場合も選択状態 -->
        <a th:href="@{/inventory/alerts(type='stock')}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedAlertType == 'stock'
                            or selectedAlertType == 'out'
                            or selectedAlertType == 'low'} ? ' active' : ''">
          在庫切れ・残りわずか
        </a>

        <!-- 期限切れ・期限まぢか：ホームからexpired・soonで移動した場合も選択状態 -->
        <a th:href="@{/inventory/alerts(type='expiry')}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedAlertType == 'expiry'
                            or selectedAlertType == 'expired'
                            or selectedAlertType == 'soon'} ? ' active' : ''">
          期限切れ・期限まぢか
        </a>

      </div>
    </section>


    <!--
      ④ アラート対象商品一覧
      InventoryControllerから受け取った商品リストを表示する

      list-group：商品を一覧形式で並べる
      list-group-item：一覧の各商品
      d-flex：横並びにする
      justify-content-between：左右に分けて配置する
      align-items-center：上下中央揃えにする
    -->
    <section class="mb-4">
      <div class="list-group">

        <!--
          商品リストを1件ずつ繰り返し表示する。
          外側のdivで商品1件分を囲み、内側のaで行全体をリンクにする。
          aの中ではdivを使わず、spanで内容をまとめる。

          data-alert-type：
          getPrimaryAlert(today)の判定結果を属性として保持する。
        -->
        <div th:each="product : ${products}"
            class="list-group-item p-0"
            th:data-alert-type="${product.getPrimaryAlert(today)}">

          <a th:href="@{/product/edit/{id}(id=${product.id})}"
            class="list-group-item-action d-flex flex-wrap align-items-center justify-content-between gap-2 w-100 px-3 py-3 text-decoration-none text-body">

            <!-- 左側：商品アイコン・商品名・カテゴリー -->
            <span class="d-flex align-items-center gap-3">

              <!-- 商品アイコン -->
              <img th:src="@{'/images/icons/' + ${product.icon.id} + '.png'}"
                  style="width:40px; height:40px; object-fit:cover;"
                  class="rounded"
                  alt="アイコン">

              <!-- 商品名・カテゴリー -->
              <span>

                <!-- 商品名：d-blockで1行ずつ表示 -->
                <span class="d-block fw-bold"
                      th:text="${product.name}">
                  牛乳
                </span>

                <!-- カテゴリー -->
                <span class="d-block text-secondary small"
                      th:text="${product.category.name}">
                  食品
                </span>

              </span>
            </span>


            <!--
              右側：購入後の確認用マーク・アラート内容

              確認マークとアラート警告を同じまとまりにし、
              「⚠ 要確認」を警告文のすぐ左に表示する。
            -->
            <span class="d-flex flex-wrap align-items-center justify-content-end gap-2 ms-auto">

              <!--
                購入後の確認用マーク

                needsReviewがtrueの場合だけ表示する。
                期限切れの状態で購入した後、
                在庫数・使用期限の確認が必要な商品を示す。

                行全体が商品編集画面へのリンクになっているため、
                この表示を押しても商品編集画面へ移動できる。

                ※画面を開くだけではフラグを解除しない。
                  編集内容の保存が成功したときに、
                  ProductService側でフラグを解除する方針。

                ※アラート警告とは別の表示条件で制御する。
                  「すべて」を選択していても、
                  needsReviewがtrueの場合は表示する。
              -->
              <span th:if="${product.needsReview == true}"
                    class="badge bg-warning-subtle text-warning-emphasis text-nowrap"
                    title="在庫数・使用期限を確認してください">
                ⚠ 要確認
              </span>


              <!--
                アラート内容
                ※Controller側でproductsを条件に合わせて取得する必要がある。

                「すべて」の場合：警告表示なし
                在庫切れ：赤色
                期限切れ：オレンジ色
                残りわずか：紫色
                期限まぢか：青色

                「⚠ 要確認」は、上記のアラートとは別の購入後の確認案内。
                needsReviewがtrueの場合は、警告文のすぐ左に表示する。
                「すべて」を選択している場合は、確認マークだけ表示する。
              -->

              <!--
                selectedAlertTypeが指定されている場合だけ、
                アラート警告を表示する。

                nullまたは空文字は「すべて」を表すため、表示しない。
              -->
              <th:block th:if="${selectedAlertType != null and selectedAlertType != ''}">

                <!--
                  商品の状態に応じた警告を1つ表示する。
                  表示する種類はgetPrimaryAlert(today)の判定結果に従う。

                  ホームからout・low・expired・soonで移動した場合も、
                  この判定結果に従って表示する。
                -->
                <th:block th:switch="${product.getPrimaryAlert(today)}">

                  <!-- 在庫切れの場合：赤色 -->
                  <span th:case="'OUT_OF_STOCK'"
                        class="d-inline-block rounded px-3 py-2 bg-danger-subtle text-danger">
                    在庫切れ
                  </span>


                  <!--
                    残りわずかの場合：紫色
                    在庫数が1以上で、購入目安以下の場合。
                    判定はgetPrimaryAlert(today)で行う。
                    text-purpleは共通CSSで定義する。
                  -->
                  <span th:case="'LOW_STOCK'"
                        class="d-inline-block rounded px-3 py-2 bg-light text-purple">
                    残りわずか（残り<span th:text="${product.stock}">1</span><span th:text="${product.unit.name}">袋</span>）
                  </span>


                  <!-- 期限切れの場合：今日より前の日付・オレンジ -->
                  <span th:case="'EXPIRED'"
                        class="d-inline-block rounded px-3 py-2 bg-warning-subtle text-warning-emphasis">
                    期限切れ（<span th:text="${#temporals.format(product.expiryDate, 'M/d')}">10/20</span>）
                  </span>


                  <!-- 期限まぢかの場合：今日からalertDays日後まで・青色 -->
                  <span th:case="'EXPIRING_SOON'"
                        class="d-inline-block rounded px-3 py-2 bg-primary-subtle text-primary">
                    期限まぢか（残り<span th:text="${T(java.time.temporal.ChronoUnit).DAYS.between(today, product.expiryDate)}">3</span>日）
                  </span>

                </th:block>

              </th:block>

            </span>


            <!--
              selectedAlertTypeがnullまたは空文字の場合は、
              右側のアラート警告を表示しない。

              「すべて」では商品情報を表示し、
              needsReviewがtrueの場合は「⚠ 要確認」も表示する。
            -->

          </a>
        </div>

      </div>


      <!-- 商品未登録、または絞り込みの結果アラート対象の商品が0件の場合 -->
      <p th:if="${#lists.isEmpty(products)}"
        class="text-center text-secondary py-4">
        アラート対象の商品はありません。
      </p>

    </section>

  </main>


  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: menu}"></div>


  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->

</body>
</html>
