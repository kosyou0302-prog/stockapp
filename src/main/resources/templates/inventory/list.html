<!--
  【役割】登録されている生活必需品の一覧を表示するメイン画面です。

  TODO: InventoryControllerから渡された商品リストを th:each でループさせ、表（table）を作る
  TODO: 各行に商品の詳細（名前、在庫数など）を th:text で表示する
  TODO: 各行に「編集画面へのリンク（th:href）」と「削除ボタン（formタグ）」を配置する
-->
<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: header}"></div>

  <!-- メインコンテンツ（ここに各画面のTODOを書いていきます） -->
  <div class="container mt-4 mb-5">

    <h2>画面タイトル（例：在庫一覧）</h2>
    <!-- TODO: ここに各画面のテーブルやフォームを作っていく -->
      
  </div>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>
</html>
