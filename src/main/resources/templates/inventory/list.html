<!--
  【役割】登録されている生活必需品の一覧を表示するメイン画面です。

  TODO: InventoryControllerから渡された商品リストを th:each でループさせ、一覧を作る
  TODO: 各行に商品の詳細（名前、カテゴリー、在庫数など）を th:text で表示する
  TODO: 各行に「編集画面へのリンク（th:href）」を配置する
  TODO: 商品登録画面へのリンクを配置する
-->
<!DOCTYPE html>

<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">

<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">

  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>

  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <!--
    ① ヘッダー（色は未だ仮設定）
    この画面専用のタイトルを中央に表示する。

    bg-primary：背景を青色 ／ text-white：文字を白色
    text-center：中央揃え ／ py-3：上下に余白を設定
  -->
  <header class="bg-primary text-white text-center py-3">
    <h1 class="h4 fw-bold mb-0">在庫一覧</h1>
  </header>

  <!-- メインコンテンツ。today：この画面で使用する今日の日付。 -->
  <main class="container mt-4 mb-5 pb-5" th:with="today=${T(java.time.LocalDate).now()}">

    <!--
      ② 商品検索欄
      商品名を入力して検索する。選択中のカテゴリーと検索キーワードをControllerへ送信する。
      input-group：入力欄とボタンをまとめる ／ form-control：入力フォームのデザイン
    -->
    <section class="mb-3">
      <form th:action="@{/inventory/list}" method="get">
        <div class="input-group">
          <!-- 商品名の検索キーワード -->
          <input type="text" name="keyword" class="form-control" placeholder="商品名で検索" th:value="${keyword}">

          <!-- 検索ボタン -->
          <button type="submit" class="btn btn-outline-primary">検索</button>
        </div>

        <!-- 選択中のカテゴリーを検索条件として引き継ぐ -->
        <input type="hidden" name="categoryId" th:value="${selectedCategoryId}" th:if="${selectedCategoryId != null}">
      </form>
    </section>

    <!--
      ③ 画面切り替えタブ
      在庫一覧と期限・在庫切れ画面を切り替える。
      nav：ナビゲーション ／ nav-pills：タブ形式 ／ nav-fill：タブを均等な幅で配置
    -->
    <section class="mb-3">
      <ul class="nav nav-pills nav-fill">
        <!-- 在庫一覧タブ -->
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/inventory/list}">在庫一覧</a>
        </li>

        <!-- 期限・在庫切れタブ -->
        <li class="nav-item">
          <a class="nav-link" th:href="@{/inventory/alerts}">期限・在庫切れ</a>
        </li>
      </ul>
    </section>

    <!--
      ④ カテゴリー絞り込み
      「すべて」とDBに登録されているカテゴリーから選択する。

      d-flex：横並び ／ flex-wrap：幅が足りない場合は折り返す
      gap-2：ボタン同士の間隔 ／ flex-fill：各ボタンに余った幅を分配する
      選択中のボタンにはactiveを付け、青背景・白文字にする。
      selectedCategoryIdがnullの場合は「すべて」を選択状態にする。
      カテゴリーを切り替える際も、検索キーワードを引き継ぐ。

      【必要なModel】
      categories：DBから取得したカテゴリー一覧
      selectedCategoryId：選択中のカテゴリーID
      keyword：商品名の検索キーワード
    -->
    <section class="mb-3">
      <div class="d-flex flex-wrap gap-2">
        <!-- すべて：カテゴリーを指定せず、検索キーワードだけを引き継ぐ -->
        <a th:href="@{/inventory/list(keyword=${keyword})}" class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedCategoryId == null} ? ' active' : ''">すべて</a>

        <!--
          DBに登録されているカテゴリーを1件ずつボタンにする。
          th:each：カテゴリー一覧を繰り返す ／ th:text：カテゴリー名を表示する
          category.idを検索条件として送り、選択中のカテゴリーにはactiveを付ける。
        -->
        <a th:each="category : ${categories}"
          th:href="@{/inventory/list(categoryId=${category.id}, keyword=${keyword})}"
          class="btn btn-outline-primary btn-sm flex-fill"
          th:classappend="${selectedCategoryId == category.id} ? ' active' : ''"
          th:text="${category.name}">カテゴリー</a>
      </div>
    </section>

    <!--
      ⑤ 商品一覧
      InventoryControllerから受け取った商品リストを表示する。
      list-group：商品を一覧形式で並べる ／ list-group-item：一覧の各商品
      d-flex：横並び ／ justify-content-between：左右に分けて配置
    -->
    <section class="mb-4">
      <div class="list-group">
        <!--
          商品リストを1件ずつ繰り返し表示。
          外側のdivで商品1件分を囲み、内側のaで行全体をリンクにする。
          aの中ではdivを使わず、spanで内容をまとめる。
        -->
        <div th:each="product : ${products}" class="list-group-item p-0">
          <a th:href="@{/product/edit/{id}(id=${product.id})}"
            class="list-group-item-action d-flex flex-wrap align-items-center justify-content-between gap-2 w-100 px-3 py-3 text-decoration-none text-body">

            <!-- 左側：商品アイコン・商品名・カテゴリー -->
            <span class="d-flex align-items-center gap-3">
              <!-- 商品アイコン：alerts.htmlと同じ画像表示 -->
              <img th:src="@{'/images/icons/' + ${product.icon.id} + '.png'}"
                  style="width:40px; height:40px; object-fit:cover;" class="rounded" alt="アイコン">

              <!-- 商品名・カテゴリー。d-blockで1行ずつ表示する。 -->
              <span>
                <span class="d-block fw-bold" th:text="${product.name}">牛乳</span>
                <span class="d-block text-secondary small" th:text="${product.category.name}">食品</span>
              </span>
            </span>

            <!--
              右側：在庫数と単位
              在庫数と単位を同じまとまりにし、右側に寄せて表示する。
              d-flex：横並び ／ align-items-center：上下中央 ／ ms-auto：右寄せ
              ※画面が狭い場合は、右側のまとまりごと折り返す。
            -->
            <span class="d-flex align-items-center ms-auto">
              <!--
                在庫切れ：赤文字 ／ 期限切れ：黄色系の文字 ／ 通常：通常の文字色
                在庫0は在庫切れだけを表示し、期限切れの色分けは在庫1以上の商品に適用する。
              -->
              <span class="fw-bold text-nowrap"
                    th:classappend="${product.stock == 0 ? 'text-danger' :
                      (product.stock != null and product.stock > 0
                      and product.expiryDate != null and product.expiryDate.isBefore(today)
                      ? 'text-warning' : '')}">
                残り<span th:text="${product.stock}">2</span><span th:text="${product.unit.name}">本</span>
              </span>
            </span>
          </a>
        </div>
      </div>

      <!-- 商品未登録、または検索・絞り込みの結果が0件の場合 -->
      <p th:if="${#lists.isEmpty(products)}" class="text-center text-secondary py-4">
        表示対象の商品はありません。
      </p>
    </section>

    <!-- ⑥ フローティング商品登録ボタン -->
<a th:href="@{/product/add}"
  class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-0 position-fixed"
  style="width:60px;
          height:60px;
          right:20px;
          bottom:80px;
          z-index:1030;
          box-shadow:0 3px 8px rgba(0,0,0,0.25);"
  aria-label="商品を登録する">
  <span class="fs-2" aria-hidden="true">＋</span>
</a>
    
    <!--
      ⑥ 商品登録ボタン
      商品登録画面へ移動する。
      d-flex：横並び ／ justify-content-end：右寄せ ／ rounded-circle：正円にする
      align-items-center・justify-content-center：＋を上下左右中央に配置する

    <section class="d-flex justify-content-end mb-4">
      <a th:href="@{/product/add}"
        class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-0"
        style="width:56px; height:56px;" aria-label="商品を登録する">
        <span class="fs-3" aria-hidden="true">＋</span>
      </a> -->
    </section>
  </main>

  <!-- ⑦ 共通ナビゲーション：fragments/menu.htmlのmenuフラグメントを画面下部に配置する -->
  <div th:replace="~{fragments/menu :: menu}"></div>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- 非同期処理（JS）が必要な画面だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>

</html>
