<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <!-- メインコンテンツ -->
  <main class="container mt-4 mb-5">

    <header class="bg-primary text-white text-center py-3">
      <h1 class="h4 fw-bold mb-0">購入履歴</h1>
    </header>

    <!-- 購入履歴リスト -->
    <div class="content mt-4">
      
      <!-- 2025/11/10 -->
      <div class="date-group mb-4">
        <div class="date-header fw-bold text-secondary mb-2 border-bottom pb-1">2025/11/10 (月)</div>
        <ul class="list-group shadow-sm">
          <li class="list-group-item d-flex align-items-center py-3">
            <div class="item-icon fs-4 me-3">🥛</div>
            <div class="item-name flex-grow-1 fw-bold">牛乳</div>
            <div class="item-qty text-muted">1本</div>
          </li>
          <li class="list-group-item d-flex align-items-center py-3">
            <div class="item-icon fs-4 me-3">🥚</div>
            <div class="item-name flex-grow-1 fw-bold">たまご</div>
            <div class="item-qty text-muted">1パック</div>
          </li>
        </ul>
      </div>

      <!-- 2025/11/05 -->
      <div class="date-group mb-4">
        <div class="date-header fw-bold text-secondary mb-2 border-bottom pb-1">2025/11/05 (水)</div>
        <ul class="list-group shadow-sm">
          <li class="list-group-item d-flex align-items-center py-3">
            <div class="item-icon fs-4 me-3">🍞</div>
            <div class="item-name flex-grow-1 fw-bold">食パン</div>
            <div class="item-qty text-muted">1斤</div>
          </li>
          <li class="list-group-item d-flex align-items-center py-3">
            <div class="item-icon fs-4 me-3">🧻</div>
            <div class="item-name flex-grow-1 fw-bold">トイレットペーパー</div>
            <div class="item-qty text-muted">1個</div>
          </li>
        </ul>
      </div>

      <!-- 2025/10/28 -->
      <div class="date-group mb-4">
        <div class="date-header fw-bold text-secondary mb-2 border-bottom pb-1">2025/10/28 (月)</div>
        <ul class="list-group shadow-sm">
          <li class="list-group-item d-flex align-items-center py-3">
            <div class="item-icon fs-4 me-3">🧴</div>
            <div class="item-name flex-grow-1 fw-bold">洗剤</div>
            <div class="item-qty text-muted">1個</div>
          </li>
        </ul>
      </div>

    </div>
  </main>

  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: menu}"></div>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>
</html>
