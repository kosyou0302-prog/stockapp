<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <!-- メインコンテンツ -->
  <main class="container mt-4 mb-5">
    <header class="bg-primary text-white text-center py-3">
      <h1 class="h4 fw-bold mb-0">購入履歴</h1>
    </header>

    <!-- 購入履歴リスト -->
    <div class="content mt-4">

      <!-- 日付ごとに繰り返す -->
      <div class="date-group mb-4" th:each="dateGroup : ${historiesByDate}">

        <!-- 同じ購入日の見出しは1回だけ表示 -->
        <div class="date-header bg-info-subtle text-primary rounded-top px-3 py-2 fw-bold">
          <span th:text="${#temporals.format(
                  dateGroup.key, 'M月d日（E）', new java.util.Locale('ja'))}">
            11月4日（水）
          </span>
        </div>

        <!-- その日に購入した商品 -->
        <ul class="list-group shadow-sm">
          <li th:each="history : ${dateGroup.value}"
              class="list-group-item d-flex align-items-center py-3">

            <!-- 商品アイコン -->
            <img th:src="@{'/images/icons/' + ${history.product.icon.id} + '.png'}"
                style="width:36px; height:36px; object-fit:cover;"
                class="rounded me-3"
                alt="アイコン">
            <!-- 購入時の商品名 -->
            <span class="flex-grow-1 fw-bold"
                  th:text="${history.name}">
              牛乳
            </span>
            <!-- 購入数量と単位 -->
            <div class="text-primary fw-bold text-nowrap">
            <span th:text="${history.quantity}">2</span><span
                  th:text="${history.product.unit.name}">本</span>
            </div>
          </li>
        </ul>
      </div>

      <!-- 購入履歴が存在しない場合 -->
      <p th:if="${#maps.isEmpty(historiesByDate)}"
        class="text-center text-secondary py-4">
        購入履歴はありません。
      </p>
    </div>
  </main>

  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: menu}"></div>

  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>
</html>
