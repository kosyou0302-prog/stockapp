<!--
  【役割】アプリ起動時に最初に表示されるダッシュボード画面です。
  現在の在庫状況のサマリーや、アラートの件数などを一目でわかるように表示します。

  TODO: HomeControllerから渡されたサマリー情報（アラート件数など）を th:text で表示する
  TODO: アラートがある場合は「inventory/alerts.html」へのリンクを目立つように配置する
-->
<!DOCTYPE html>
<!-- Thymeleafを使う宣言と、言語を日本語(ja)に設定 -->
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <!-- 文字化けを防ぐUTF-8設定 -->
  <meta charset="UTF-8">
  <!-- スマホやタブレットでも綺麗に表示するためのViewport設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 画面のタブに表示されるタイトル（各画面で書き換えてOK） -->
  <title>生活必需品ストックアプリ</title>
  <!-- Bootstrap 5 CSS (CDN経由で読み込み：インストール不要) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- チームオリジナルの共通CSS（Thymeleafの @{} を使うと自動で正しいパスになります） -->
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <!-- メインコンテンツ（ここに各画面のTODOを書いていきます） -->
  <main class="container mt-4 mb-5">

    <header class="bg-primary text-white text-center py-3">
  <h1 class="h4 fw-bold mb-0">ホーム</h1>

</header>

    <!-- TODO: ここに各画面のテーブルやフォームを作っていく -->


    <!--
      ① お知らせエリア
      在庫切れ・期限切れの商品がある場合にお知らせを表示する

      alert：Bootstrapのお知らせ表示
      alert-danger：赤色のお知らせ
      alert-warning：黄色のお知らせ
      d-flex：横並びにする
      justify-content-between：左右に分けて配置する
    -->
    <section class="mb-4  mt-4">

      <!-- 在庫切れのお知らせ（1件以上ある場合に表示） -->
      <a th:if="${homeSummary.outOfStockCount > 0}"
        th:href="@{/alerts(type='out')}"
        class="alert alert-danger d-flex justify-content-between align-items-center text-decoration-none">

        <span>⚠ 在庫切れの商品があります。</span>

        <span class="fw-bold"
              th:text="'(' + ${homeSummary.outOfStockCount} + '件)'">
          (0件)
        </span>
      </a>

      <!-- 期限切れのお知らせ（1件以上ある場合に表示） -->
      <a th:if="${homeSummary.expiredCount > 0}"
        th:href="@{/alerts(type='expired')}"
        class="alert alert-warning d-flex justify-content-between align-items-center text-decoration-none">

        <span>⚠ 期限切れの商品があります。</span>

        <span class="fw-bold"
              th:text="'(' + ${homeSummary.expiredCount} + '件)'">
          (0件)
        </span>
      </a>

    </section>


    <!--
      ② 在庫状況カード
      在庫切れ・期限切れ・残りわずか・期限間近の4種類を表示する

      row：カードを並べる行
      g-3：カード同士の間隔
      col-6：横幅を半分にする（2列表示）
    -->
    <section class="mb-4">

      <h3 class="h5 fw-bold mb-3">在庫状況</h3>

      <div class="row g-3">

        <!-- 在庫切れカード -->
        <div class="col-6">
          <a th:href="@{/alerts(type='out')}"
            class="card bg-danger-subtle text-danger text-center text-decoration-none h-100">

            <div class="card-body">

              <div class="fs-2 mb-2">🛒</div>

              <h4 class="h6 fw-bold">在庫切れ</h4>

              <p class="h4 fw-bold mb-0">
                <span th:text="${homeSummary.outOfStockCount}">2</span>件
              </p>

            </div>
          </a>
        </div>


        <!-- 期限切れカード -->
        <div class="col-6">
          <a th:href="@{/alerts(type='expired')}"
            class="card bg-warning-subtle text-warning-emphasis text-center text-decoration-none h-100">

            <div class="card-body">

              <div class="fs-2 mb-2">⏰</div>

              <h4 class="h6 fw-bold">期限切れ</h4>

              <p class="h4 fw-bold mb-0">
                <span th:text="${homeSummary.expiredCount}">3</span>件
              </p>

            </div>
          </a>
        </div>


        <!-- 残りわずかカード -->
        <div class="col-6">
          <a th:href="@{/alerts(type='low')}"
            class="card bg-primary-subtle text-primary text-center text-decoration-none h-100">

            <div class="card-body">

              <div class="fs-2 mb-2">📦</div>

              <h4 class="h6 fw-bold">残りわずか</h4>

              <p class="h4 fw-bold mb-0">
                <span th:text="${homeSummary.lowStockCount}">2</span>件
              </p>

            </div>
          </a>
        </div>


        <!-- 期限間近カード -->
        <div class="col-6">
          <a th:href="@{/alerts(type='soon')}"
            class="card bg-secondary-subtle text-secondary text-center text-decoration-none h-100">

            <div class="card-body">

              <div class="fs-2 mb-2">📅</div>

              <h4 class="h6 fw-bold">期限間近</h4>

              <p class="h4 fw-bold mb-0">
                <span th:text="${homeSummary.expiringSoonCount}">2</span>件
              </p>

            </div>
          </a>
        </div>

      </div>
    </section>


    <!--
      ③ カテゴリ別の在庫
      食品・日用品・その他の3種類に分けて商品数を表示する
      col-4：横幅を3分の1にする（3列表示）
    -->
    <section class="mb-4">

      <h3 class="h5 fw-bold mb-3">カテゴリ別の在庫</h3>

      <div class="row g-3">

        <!-- 食品 -->
        <div class="col-4">
          <a th:href="@{/inventory(category='食品')}"
            class="card text-center text-decoration-none h-100">

            <div class="card-body p-2">

              <div class="fs-2 mb-2">🛒</div>

              <h4 class="h6 fw-bold text-dark">食品</h4>

            </div>
          </a>
        </div>


        <!-- 日用品 -->
        <div class="col-4">
          <a th:href="@{/inventory(category='日用品')}"
            class="card text-center text-decoration-none h-100">

            <div class="card-body p-2">

              <div class="fs-2 mb-2">🧴</div>

              <h4 class="h6 fw-bold text-dark">日用品</h4>

            </div>
          </a>
        </div>


        <!-- その他 -->
        <div class="col-4">
          <a th:href="@{/inventory(category='その他')}"
            class="card text-center text-decoration-none h-100">

            <div class="card-body p-2">

              <div class="fs-2 mb-2">🧹</div>

              <h4 class="h6 fw-bold text-dark">その他</h4>

            </div>
          </a>
        </div>

      </div>
    </section>

  </main>

  <!-- 共通ナビゲーションメニューの読み込み（fragments/menu.html をここに差し込む） -->
  <div th:replace="~{fragments/menu :: menu}"></div>


  <!-- Bootstrap 5 JS (CDN経由：ドロップダウンやモーダルなどを動かすために必要) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- 非同期処理（JS）が必要な画面（買い物リストなど）だけ、以下のコメントアウトを外してJSを読み込む -->
  <!-- <script th:src="@{/js/app.js}"></script> -->
</body>
</html>
